{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %} Default title {% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="{% static '/css/style.css' %}" />
  </head>
  <body>
    <nav class="navbar md:navbar-expand bg-1 fg-2">
      <div class="container-fluid">
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarTogglerDemo01"
          aria-controls="navbarTogglerDemo01"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="navbarTogglerDemo01"
          aria-labelledby="navbarTogglerDemo01Label"
        >
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarTogglerDemo01Label">
              VVV_609-31z
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
              aria-label="Close"
            ></button>
          </div>
          <div class="drawer-body">
            <a class="navbar-brand" href="{% url 'homepage' %}">VVV_609-31z</a>
            <ul class="navbar-nav me-auto mb-2 md:mb-0">
              <li class="nav-item">
                <a class="nav-link" href="{% url 'homepage' %}">Главная</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/articles/">Статьи</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/about/">О проекте</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'articles:create' %}">Новая статья</a>
              </li>
            </ul>
            <div class="d-flex gap-2">
                {% if user.is_authenticated %}
                    <span class="fg-2 d-flex align-items-center">{{ user.username }}</span>
                    <form class="m-0" action="/accounts/logout/" method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn-outline theme-danger">Logout</button>
                    </form>
                {% else %}
                    <a href="/accounts/login/" class="btn-outline">Login</a>
                    <a href="/accounts/signup/" class="btn-outline theme-success">Sign Up</a>
                {% endif %}
            </div>
          </div>
        </dialog>
      </div>
    </nav>

    <div class="container">{% block content %}{% endblock %}</div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
