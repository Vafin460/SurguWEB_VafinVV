{% extends "base_layout.html" %}
{% block title %}
  {{ article.title }}
{% endblock title %}
{% block content %}
    <div class="card w-50">
      <div class="card-body">
        <p class="card-text">{{ article.title }}</p>
      </div>
      <img src="{{ article.thumbnail.url }}" class="card-img-top" alt="..." />

      <div class="card-body">
        <p class="card-text">{{ article.body }}</p>
      </div>

      <div class="card-footer">
        <p class="fg-2"><small class="text-muted">{{ article.date }}</small></p>
      </div>
    </div>
{% endblock content %}
